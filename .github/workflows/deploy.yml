name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: milimili-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --shamefully-hoist

      - name: Build shared types
        run: pnpm -F @mtobdvlb/shared-types build

      - name: Build server
        run: pnpm -F server build

      - name: Build web
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ secrets.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
          NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
          NEXT_PUBLIC_SENTRY_REPLAY_SAMPLE_RATE: ${{ secrets.NEXT_PUBLIC_SENTRY_REPLAY_SAMPLE_RATE }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_UPLOAD_SOURCEMAPS: ${{ secrets.SENTRY_UPLOAD_SOURCEMAPS }}
        run: pnpm -F web build

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare deploy bundle
        run: |
          rm -rf apps/web/.next/dev apps/web/.next/cache

          mkdir -p \
            deploy_bundle/apps/server \
            deploy_bundle/apps/web \
            deploy_bundle/packages/shared-types \
            deploy_bundle/packages/tailwind-config \
            deploy_bundle/packages/typescript-config \
            deploy_bundle/scripts

          if [ -d apps/web/.next/node_modules ]; then
            find apps/web/.next/node_modules -maxdepth 1 -type l -exec sh -c '
              for path do
                link_name="$(basename "$path")"
                case "$link_name" in
                  */*|.*|*" "*) continue ;;
                esac

                target="$(readlink "$path")"
                case "$target" in
                  ../../../../node_modules/*) printf "%s\t%s\n" "$link_name" "$target" ;;
                esac
              done
            ' sh {} + > deploy_bundle/apps/web/.next-node-module-links.tsv
          fi

          rm -rf apps/web/.next/node_modules

          cp package.json deploy_bundle/package.json
          cp pnpm-lock.yaml deploy_bundle/pnpm-lock.yaml
          cp pnpm-workspace.yaml deploy_bundle/pnpm-workspace.yaml
          cp turbo.json deploy_bundle/turbo.json
          cp start.sh deploy_bundle/start.sh
          if [ -f .npmrc ]; then cp .npmrc deploy_bundle/.npmrc; fi

          {
            printf '%s\n' 'SENTRY_DSN=${{ secrets.SENTRY_DSN }}'
            printf '%s\n' 'SENTRY_ENVIRONMENT=${{ secrets.SENTRY_ENVIRONMENT }}'
            printf '%s\n' 'SENTRY_TRACES_SAMPLE_RATE=${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}'
            printf '%s\n' 'NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}'
            printf '%s\n' 'NEXT_PUBLIC_SENTRY_ENVIRONMENT=${{ secrets.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}'
            printf '%s\n' 'NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${{ secrets.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}'
            printf '%s\n' 'NEXT_PUBLIC_SENTRY_REPLAY_SAMPLE_RATE=${{ secrets.NEXT_PUBLIC_SENTRY_REPLAY_SAMPLE_RATE }}'
            printf '%s\n' 'LOG_LEVEL=${{ secrets.LOG_LEVEL }}'
            printf '%s\n' 'OTEL_ENABLED=${{ secrets.OTEL_ENABLED }}'
            printf '%s\n' 'OTEL_SERVICE_NAME=${{ secrets.OTEL_SERVICE_NAME }}'
            printf '%s\n' 'OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}'
          } > deploy_bundle/.env.production

          cp apps/server/package.json deploy_bundle/apps/server/package.json
          cp apps/web/package.json deploy_bundle/apps/web/package.json
          cp apps/web/next.config.ts deploy_bundle/apps/web/next.config.ts
          cp packages/shared-types/package.json deploy_bundle/packages/shared-types/package.json
          cp packages/tailwind-config/package.json deploy_bundle/packages/tailwind-config/package.json
          cp packages/typescript-config/package.json deploy_bundle/packages/typescript-config/package.json

          cp -R apps/server/dist deploy_bundle/apps/server/dist
          cp -R apps/web/.next deploy_bundle/apps/web/.next
          if [ -d apps/web/public ]; then cp -R apps/web/public deploy_bundle/apps/web/public; fi
          cp scripts/deploy_app_container.sh deploy_bundle/scripts/deploy_app_container.sh

      - name: Upload deploy bundle
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o ConnectTimeout=10" \
            deploy_bundle/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Restart app container
        run: |
          ssh -i ~/.ssh/id_ed25519 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o ConnectTimeout=10 "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' APP_CONTAINER='${{ secrets.DEPLOY_APP_CONTAINER }}' sh '${{ secrets.DEPLOY_PATH }}/scripts/deploy_app_container.sh'"

      - name: Verify production health
        run: |
          curl --fail --show-error --silent --retry 10 --retry-delay 3 --retry-all-errors \
            https://www.mtobdvlb.icu/api/v1/healthz >/dev/null
          curl --fail --show-error --silent --retry 10 --retry-delay 3 --retry-all-errors \
            https://www.mtobdvlb.icu/api/v1/readyz >/dev/null
          curl --fail --show-error --silent --retry 10 --retry-delay 3 --retry-all-errors \
            https://www.mtobdvlb.icu/ >/dev/null
          curl --fail --show-error --silent --retry 10 --retry-delay 3 --retry-all-errors \
            https://www.mtobdvlb.icu/login >/dev/null
