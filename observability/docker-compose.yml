services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: milimili-uptime-kuma
    restart: unless-stopped
    ports:
      - '127.0.0.1:3002:3001'
    volumes:
      - uptime_kuma_data:/app/data

  alloy:
    image: grafana/alloy:latest
    container_name: milimili-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    env_file:
      - ${OBSERVABILITY_ENV_FILE:-.env.observability.example}
    ports:
      - '127.0.0.1:12345:12345'
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro

volumes:
  uptime_kuma_data:
