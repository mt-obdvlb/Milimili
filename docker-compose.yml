services:
  milimili:
    image: milimili-app:latest
    container_name: milimili-app
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    container_name: milimili-mongo
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7-alpine
    container_name: milimili-redis
    volumes:
      - redis_data:/data
    restart: always

volumes:
  mongo_data:
  redis_data:
